<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

  <!-- tailwind and daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- css link -->
    <link rel="stylesheet" href="./style/style.css" />

</head>
<body>

<nav class="border-b border-b-[#E9E9E9] bg-white">
    <div class="py-[17px] px-[80px]">
        <div class="flex items-center justify-between">
            <div>
                <img src="./assets/main-logo.png" alt="main-logo">
            </div>
            <div class="flex items-center justify-center gap-2">
                <label class="input">
  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input type="search" class="grow focus:outline-0" placeholder="Search" />
</label>
<button class="btn btn-active btn-primary">Primary</button>
            </div>
        </div>
    </div>
</nav>


<!-- section -->
 <section>
    <div class="container">
        <div class="rounded-[8px] shadow-[0_0_15px_5px_rgba(0,0,0,0.08)] my-[60px]">
           <div class="py-[24px] pl-[24px]">
            <button class="btn btn-active btn-primary">All</button>
           <button class="btn btn-outline btn-primary">Open</button>
           <button class="btn btn-outline btn-primary">Closed</button>
           </div>
        </div>
        
    </div>
 </section>

    
    <script src="./js/home.js"></script>
</body>
</html>
