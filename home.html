<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

  <!-- tailwind and daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- css link -->
    <link rel="stylesheet" href="./style/style.css" />

</head>
<body>

<nav class="border-b border-b-[#E9E9E9] bg-white">
    <div class="py-[17px] px-[80px]">
        <div class="md:flex items-center justify-between sm:gap-3">
            <div>
                <img src="./assets/main-logo.png" alt="main-logo">
            </div>
            <div class="flex items-center justify-center gap-2">
                <label class="input">
  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input type="search" class="grow focus:outline-0" placeholder="Search" />
</label>
<button class="btn btn-active btn-primary">Primary</button>
            </div>
        </div>
    </div>
</nav>


<!-- section -->
 <section>
    <div class="container" >
        <div class="rounded-[8px] shadow-[0_0_15px_5px_rgba(0,0,0,0.08)] my-[60px]">
           <div class="py-[24px] pl-[24px]">
            <button class="btn btn-active btn-primary">All</button>
           <button class="btn btn-outline btn-primary">Open</button>
           <button class="btn btn-outline btn-primary">Closed</button>
           </div>
        </div>
        <div>
          <div>
              <div class="md:flex items-center justify-between p-[24px] shadow-[0_0_15px_5px_rgba(0,0,0,0.08)]">
                <div class="flex items-center justify-center gap-2">
                  <div class="bg-[#ECE4FF] p-[9px] rounded-full">
                    <img src="./assets/Aperture.png" alt="logo">
                  </div>
                  <div>
                    <p class="font-semibold text-[20px] text-[#1F2937]"><span id="issue-count">50</span> Issues</p>
                    <p class="text-[16px] text-[#64748B] pt-[2px]">Track and manage your project issues</p>
                  </div>
                </div>
                <div class="flex items-center justify-center gap-4">
                  <div class="flex items-center justify-center gap-3">
                    <div class="h-[12px] w-[12px] bg-[#00A96E] rounded-full"></div>
                    <p>open</p>
                  </div>
                  <div class="flex items-center justify-center gap-3">
                    <div class="h-[12px] w-[12px] bg-[#A855F7] rounded-full"></div>
                    <p>open</p>
                  </div>
                </div>
              </div>    
          </div>
        </div>

    </div>
 </section>
 <!-- issues section -->
<section class="bg-white m-[24px]">
  <div class="container">
    <div class="grid sm:grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-[12px]" id="issusContent">
       
    </div>
    <section class="bg-white m-[24px]">
  <div class="container mx-auto">
    <div id="loading-spinner" class="hidden flex justify-center my-10">
      <span class="loading loading-bars loading-xl text-primary"></span>
    </div>

    <div class="grid sm:grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-6" id="issusContent">
       </div>
  </div>
</section>
<!-- Open the modal using ID.showModal() method -->
<button class="btn" onclick="my_modal_1.showModal()">open modal</button>
<dialog id="my_modal_1" class="modal">
  <div class="modal-box w-11/2/12 max-w-2xl">
    <h3 id="modal-title" class="text-xl font-bold"></h3>
    <div id="modal-loading" class="hidden flex justify-center py-4">
        <span class="loading loading-spinner loading-md"></span>
    </div>
    <div id="modal-body" class="py-4">
        </div>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>
  </div>
</section>

    
    <script src="./js/home.js"></script>
</body>
</html>
